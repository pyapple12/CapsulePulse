[package]
name = "capsule-pulse"
version = "0.1.0"
edition = "2021"
description = "CapsulePulse——玻璃质感的工作计时看板"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.4.0"
thiserror = "2.0.20"
window-vibrancy = "0.8.0"
